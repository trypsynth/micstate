name: Build Windows

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025-vs2026
            triplet: x64-windows-static
          - arch: arm64
            runner: windows-11-vs2026-arm
            triplet: arm64-windows-static
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Bootstrap vcpkg
        run: ./vcpkg/bin/bootstrap-vcpkg.bat -disableMetrics
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
      - name: Build
        run: cmake --build build --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/package -Force | Out-Null
          Copy-Item build/micstate.exe, README.md, LICENSE.md dist/package
          Compress-Archive -Path dist/package/* -DestinationPath dist/micstate-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: micstate-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: micstate-windows-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --title "Micstate ${RELEASE_TAG#v}" --generate-notes
